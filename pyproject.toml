[project]
name = "yourorg-content"
version = "0.1.0"
description = "Typed content for our sites and services, generated from Coho CMS."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "coho-delivery-sdk~=2026.1.0",
]

[dependency-groups]
dev = [
    "coho-codegen~=2026.1.0",
    "pytest>=8.3",
    "mypy>=1.11",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yourorg_content"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Generated by coho-codegen: never edited, so never reformatted.
extend-exclude = ["src/yourorg_content/coho"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# The formatter wraps code; a long string or comment stays whole.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["yourorg_content"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = "-q"
